[project]
name = "wm811k"
version = "0.1.0"
description = "yield pattern analysis of the wm811k wafer map dataset"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "matplotlib", "scikit-learn", "scipy", "pyyaml", "torch"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
