# one seed for everything so any run can be repeated exactly
seed: 811

data:
  pickle: LSWMD.pkl

split:
  # 20 folds with 3 for validation and 3 for test gives about 70 15 15
  n_folds: 20
  val_folds: 3
  test_folds: 3

simulator:
  # seeds for the example figure  kept next to the project seed so the figure can be rebuilt exactly
  figure_seeds: [811, 812, 813]
  # the grid the default fault settings were tuned on
  rows: 40
  cols: 40
  # the most common wm811k map size from results audit_map_sizes csv
  wm811k_rows: 32
  wm811k_cols: 29

rf:
  # leaf sizes tried on the validation set  bigger leaves smooth the forest
  leaf_sizes: [1, 3, 10]

cnn:
  # maps are resized to size x size before going into the network
  size: 64
  # loss weightings tried on validation  sqrt is the softer push to rare classes
  weight_schemes: [sqrt, balanced]
  max_epochs: 40
  # stop after this many epochs with no gain in validation macro f1
  patience: 6
  # more starting seeds for the chosen setup to show run to run spread
  extra_seeds: [812, 813]

abstain:
  # d44 the most defect wafers the gate may pass as clean  picked on validation
  max_missed_defect_share: 0.05
  # p none thresholds tried for the gate
  gate_min: 0.30
  gate_max: 0.99
  gate_step: 0.01

label_audit:
  # both models must give at least this probability to the class they agree on
  min_p: 0.8
  # how many candidates go on the contact sheets for review by hand
  max_candidates: 100

vlm:
  model: gpt-6-luna
  # d47 maps per class drawn from the test set  near full has 23 in test so every class gets 20
  per_class: 20
  prompts: [raw, rules]
  # calls running at once
  workers: 4
  # d48 standard tier prices from developers.openai.com/api/docs/pricing checked 2026-11-03
  price_per_million_usd:
    input: 0.10
    cached_input: 0.01
    output: 0.50

assistant:
  model: gpt-6-luna
  # d49 test wafers per predicted pattern sent to the assistant
  per_class: 6
  workers: 4

synthetic:
  # d51 simulated maps per class for the synthetic only training set
  per_class: 3000
  # grids smaller than this on either side are skipped because the wafer is only a few dies
  min_side: 10
  # share of dies failing from background on clean and patterned wafers
  # 0.01 to 0.15 spans the yield quartiles of the unlabeled maps  1 minus 0.986 and 1 minus 0.862
  background_fail_share: [0.01, 0.15]
  # random wafers sit well above that background
  random_fail_share: [0.2, 0.6]
